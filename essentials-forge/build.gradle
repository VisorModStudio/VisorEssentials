// Build script of every ":essentials-forge:<mc>" subproject.
plugins {
    id "essentials.loader"
}

dependencies {
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // @Environment annotation of the shared sources, Forge ignores it
    compileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}") { transitive = false }

    // MixinExtras annotations of the shared sources; Visor ships the runtime
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
}

loom {
    forge {
        convertAccessWideners(modJar, loom.accessWidenerPath.get().asFile.name)

        mixinConfig "${mod_id}.mixins.json"
    }
}
