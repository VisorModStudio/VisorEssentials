# ---- Mod --------------------------------------------------------------------------------------
mod_id = "visor_essentials"
mod_name = "VisorEssentials"
mod_group = "org.vmstudio"
mod_authors = "PhoenixRa"
mod_description = "Visor Addon, that is aimed to enhance the VR experience"
mod_license = "LGPL-3.0-only"

# ---- Visor ------------------------------------------------------------------------------------
# (AtumVR and AtumConfiguration included).
# "local" = <root>/libs, "maven" = Modrinth Maven (maven.modrinth:visor:<visor_version>+mc<mc>-<loader>:api)
visor_source  = "maven"
visor_version = "0.6.0-beta"
visor_version_range_fabric    = ">=0.6.0-beta"
visor_version_range_forgelike = "[0.6.0-beta,)"

# ---- Common dependencies ----------------------------------------------------------------------
fabric_loader_version = "0.16.14"
fabric_loader_version_range = ">=0.14.14"
# Compatibility level of the mixin configs: JAVA_<level>
mixin_compat_level    = 17
mixin_extras_version  = "0.4.1"
lombok_version        = "1.18.46"
jetbrains_annotations_version = "26.1.0"

# ---- Version Targets --------------------------------------------------------------------------
[targets]
"1.20.1" = ["fabric", "forge"]
"1.20.2" = ["fabric", "forge", "neoforge"]
